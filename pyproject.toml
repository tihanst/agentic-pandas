[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_pandas"]

[project]
name = "agentic-pandas"
version = "0.1.0"
description = "LLM-driven pandas agent for data manipulation and transformation, executed in a sandboxed Docker kernel."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "tihanst" }]
keywords = ["pandas", "llm", "agent", "mcp", "jupyter", "docker"]
dependencies = [
    "ipykernel>=7.2.0",
    "jupyter-client>=8.8.0",
    "litellm<=1.82.6",
    "matplotlib>=3.10.8",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "fastmcp>=3.2.0",
]

[tool.uv]
exclude-newer = "2026-04-02T00:00:00Z"

[project.scripts]
agentic-pandas = "agentic_pandas.main:run"
agentic-pandas-server = "agentic_pandas.server:main"
