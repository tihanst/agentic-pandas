[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_pandas"]

[project]
name = "agentic-pandas"
version = "0.1.0"
description = "A pandas agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "jupyter-client>=8.8.0",
    "litellm<=1.82.6",
    "matplotlib>=3.10.8",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "fastmcp>=3.2.0",
]
